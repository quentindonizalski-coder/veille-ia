name: Miniatures des articles

on:
  push:
    branches: [main]
    paths: ['articles/**']
  schedule:
    - cron: '17 */6 * * *'   # rattrapage des anciens articles toutes les 6 h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les miniatures manquantes
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: node scripts/generate-thumbnails.js
      - name: Enregistrer les nouvelles miniatures
        run: |
          git add assets/thumbs
          if git diff --cached --quiet; then
            echo "Aucune nouvelle miniature."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Miniatures des articles"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
